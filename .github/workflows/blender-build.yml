name: Build Genius Academy Blender World

on:
  workflow_dispatch:
  push:
    paths:
      - "blender/**"
      - ".github/workflows/blender-build.yml"

permissions:
  contents: read

jobs:
  build-blender-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils xvfb
          blender --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1' || true

      - name: Create output directories
        run: |
          mkdir -p blender/renders
          mkdir -p public/models

      - name: Build Genius Academy scene
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" blender --background --python blender/build_academy.py

      - name: Verify outputs
        run: |
          test -s blender/renders/academy-preview.png
          test -s public/models/genius-academy.glb
          test -s blender/genius-academy.blend
          ls -lh blender/renders/academy-preview.png public/models/genius-academy.glb blender/genius-academy.blend

      - name: Upload Blender outputs
        uses: actions/upload-artifact@v4
        with:
          name: genius-academy-blender-world
          if-no-files-found: error
          retention-days: 14
          path: |
            blender/renders/academy-preview.png
            blender/genius-academy.blend
            public/models/genius-academy.glb
