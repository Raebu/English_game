name: Build Genius Academy Blender World

on:
  workflow_dispatch:
  push:
    paths:
      - "blender/*.py"
      - ".github/workflows/blender-build.yml"

permissions:
  contents: write

jobs:
  build-blender-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
      PYTHONPATH: /usr/lib/python3/dist-packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils xvfb
          blender --version

      - name: Verify Blender Python dependencies
        run: |
          xvfb-run -a blender --background --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"

      - name: Create output directories
        run: |
          mkdir -p blender/renders public/models

      - name: Normalise Blender 4.0 Eevee engine name
        run: |
          sed -i 's/BLENDER_EEVEE_NEXT/BLENDER_EEVEE/g' blender/build_academy.py

      - name: Build Genius Academy scene
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" blender --background --python blender/build_academy.py

      - name: Verify outputs
        run: |
          test -s blender/renders/academy-preview.png
          test -s public/models/genius-academy.glb
          test -s blender/genius-academy.blend
          ls -lh blender/renders/academy-preview.png public/models/genius-academy.glb blender/genius-academy.blend

      - name: Publish generated game asset
        run: |
          git config user.name "Genius Academy Blender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/models/genius-academy.glb blender/renders/academy-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Genius Academy world asset [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload Blender outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genius-academy-blender-world
          if-no-files-found: warn
          retention-days: 14
          path: |
            blender/renders/academy-preview.png
            blender/genius-academy.blend
            public/models/genius-academy.glb
